    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              mono: ['Space Grotesk', 'monospace'],
            },
            animation: {
              'liquid': 'liquid 12s infinite alternate ease-in-out',
              'glow': 'glow 2s ease-in-out infinite alternate',
              'float-slow': 'float 6s ease-in-out infinite',
              'scanline': 'scanline 8s linear infinite',
              'pulse-soft': 'pulse-soft 3s ease-in-out infinite',
              'dot': 'dot 1.4s infinite ease-in-out',
            },
            keyframes: {
              liquid: {
                '0%': { 'border-radius': '60% 40% 30% 70% / 60% 30% 70% 40%' },
                '50%': { 'border-radius': '30% 60% 70% 30% / 50% 60% 30% 60%' },
                '100%': { 'border-radius': '60% 40% 30% 70% / 60% 30% 70% 40%' },
              },
              'pulse-soft': {
                '0%, 100%': { opacity: '0.2' },
                '50%': { opacity: '0.5' },
              },
              dot: {
                '0%, 80%, 100%': { transform: 'scale(0)', opacity: '0.3' },
                '40%': { transform: 'scale(1)', opacity: '1' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                '50%': { transform: 'translateY(-15px) rotate(1deg)' },
              },
              scanline: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(100%)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --bg-main: #020617;
        --accent: #3b82f6;
        --accent-glow: rgba(59, 130, 246, 0.5);
      }
      
      body {
        background-color: var(--bg-main);
        color: #f8fafc;
        overflow-x: hidden;
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #020617;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(59, 130, 246, 0.3);
        border-radius: 20px;
      }

      .glass-card {
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      }

      .neo-button {
        position: relative;
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      }

      .neo-button::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(45deg, transparent, rgba(255,255,255,0.15), transparent);
        transform: translateX(-100%);
        transition: 0.6s;
      }

      .neo-button:hover::after {
        transform: translateX(100%);
      }

      .gradient-border-blue {
        position: relative;
        border-radius: 1.5rem;
      }
      
      .gradient-border-blue::before {
        content: '';
        position: absolute;
        inset: -1px;
        background: linear-gradient(45deg, #3b82f6, #0ea5e9, #6366f1);
        z-index: -1;
        border-radius: inherit;
        opacity: 0.2;
        transition: opacity 0.3s;
      }
      
      .gradient-border-blue:hover::before {
        opacity: 0.8;
      }

      @keyframes message-pop {
        0% { transform: translateY(20px) scale(0.98); opacity: 0; }
        100% { transform: translateY(0) scale(1); opacity: 1; }
      }
      .animate-message { animation: message-pop 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      
      html { scroll-behavior: smooth; }
    </style>

{

    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
